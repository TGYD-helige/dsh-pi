- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
# The smoke probe is a loose profile module; 0.1.5-rc.2's default-on package inventory
# rejects it because the CLI-generated profile package.json has a name but no version.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
# Trace every smoke run; the final step asserts the session reaches Langfuse.
- id: langfuse
  config:
    enabled: true
    publicKey: !!js process.env.LANGFUSE_PUBLIC_KEY
    secretKey: !!js process.env.LANGFUSE_SECRET_KEY
    baseUrl: !!js process.env.LANGFUSE_BASE_URL
- id: llm-deepseek
  config:
    apiKeyEnv: DSH_INTEGRATION_API_KEY
    baseURL: !!js process.env.DSH_INTEGRATION_BASE_URL
    thinking: enabled
    reasoningEffort: high
    maxTokens: 384000
    models:
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        contextWindow: 1000000
