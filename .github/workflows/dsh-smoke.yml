name: DSH smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    name: DSH smoke (${{ matrix.extension }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: pi-image-gen
            package: '@amaster.ai/pi-image-gen@0.1.8'
            specifier: '@amaster.ai/pi-image-gen'
            tool: image_generate
          - extension: pi-web-access
            package: '@amaster.ai/pi-web-access@0.1.8'
            specifier: '@amaster.ai/pi-web-access'
            tool: web_fetch
    env:
      DSH_INTEGRATION_API_KEY: ${{ secrets.DSH_INTEGRATION_API_KEY }}
      DSH_INTEGRATION_BASE_URL: ${{ secrets.DSH_INTEGRATION_BASE_URL }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm install --global @deepseek-ai/dsh@0.1.0-rc.6

      - name: Configure DSH profile paths
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home-${{ matrix.extension }}" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/dsh-home-${{ matrix.extension }}/profiles/ci" >> "$GITHUB_ENV"

      - name: Validate integration secrets
        run: |
          test -n "$DSH_INTEGRATION_BASE_URL" || { echo "::error::DSH_INTEGRATION_BASE_URL is required"; exit 1; }
          test -n "$DSH_INTEGRATION_API_KEY" || { echo "::error::DSH_INTEGRATION_API_KEY is required"; exit 1; }
          if [ "${{ matrix.extension }}" = pi-web-access ]; then
            test -n "$FIRECRAWL_API_KEY" || { echo "::error::FIRECRAWL_API_KEY is required"; exit 1; }
          fi

      - name: Install dsh-pi and ${{ matrix.extension }}
        run: dsh plugin --profile ci add . "${{ matrix.package }}"

      - name: Configure and verify the profile
        run: |
          cp ".github/dsh-smoke/${{ matrix.extension }}/cordis.patch.yml" "$PI_CODING_AGENT_DIR/cordis.patch.yml"
          cp ".github/dsh-smoke/${{ matrix.extension }}/settings.json" "$PI_CODING_AGENT_DIR/settings.json"
          cp .github/dsh-smoke/probe.mjs "$PI_CODING_AGENT_DIR/dsh-smoke-probe.mjs"
          test -f "$PI_CODING_AGENT_DIR/node_modules/${{ matrix.specifier }}/package.json"
          dsh --profile ci --dump-config | tee "$RUNNER_TEMP/dsh-config.yml"
          grep -F "${{ matrix.specifier }}" "$RUNNER_TEMP/dsh-config.yml"
          export DSH_SMOKE_EXPECTED_TOOL="${{ matrix.tool }}"
          export DSH_SMOKE_WITNESS="$RUNNER_TEMP/${{ matrix.extension }}.loaded"
          set -o pipefail
          dsh --profile ci 2>&1 | tee "$RUNNER_TEMP/${{ matrix.extension }}-dsh.log"
          test "$(cat "$DSH_SMOKE_WITNESS")" = "$DSH_SMOKE_EXPECTED_TOOL"
