name: DSH integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    name: DSH E2E (${{ matrix.extension }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: pi-image-gen
            package: '@amaster.ai/pi-image-gen@0.1.8'
            specifier: '@amaster.ai/pi-image-gen'
            tool: image_generate
            expected-result: 'Generated 1 image(s)'
            prompt: "Use image_generate exactly once with prompt 'a solid red square on a plain white background'. Then report the generated file path."
          - extension: pi-web-access
            package: '@amaster.ai/pi-web-access@0.1.8'
            specifier: '@amaster.ai/pi-web-access'
            tool: web_fetch
            expected-result: 'Example Domain'
            prompt: "Use web_fetch exactly once on https://example.com with prompt 'Return the page title'. Then report the title."
          - extension: pi-browser-use
            package: '@amaster.ai/pi-browser-use@0.1.15'
            specifier: '@amaster.ai/pi-browser-use'
            tool: browser_navigate_page
            expected-result: 'Example Domain'
            prompt: "Use browser_navigate_page exactly once to navigate to https://example.com. Then report the page title."
    env:
      DSH_INTEGRATION_API_KEY: ${{ secrets.DSH_INTEGRATION_API_KEY }}
      DSH_INTEGRATION_BASE_URL: ${{ secrets.DSH_INTEGRATION_BASE_URL }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack the published bundle shape
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          version=$(node -p "require('./package.json').version")
          echo "DSH_PI_TARBALL=$RUNNER_TEMP/dsh-pi-host-$version.tgz" >> "$GITHUB_ENV"
      - run: npm install --global @deepseek-ai/dsh@0.1.5-rc.2

      - name: Configure DSH profile paths
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home-${{ matrix.extension }}" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/dsh-home-${{ matrix.extension }}/profiles/headless" >> "$GITHUB_ENV"
          echo "DSH_SMOKE_SESSION_FILE=$RUNNER_TEMP/${{ matrix.extension }}.session" >> "$GITHUB_ENV"

      - name: Validate integration secrets
        run: |
          test -n "$DSH_INTEGRATION_BASE_URL" || { echo "::error::DSH_INTEGRATION_BASE_URL is required"; exit 1; }
          test -n "$DSH_INTEGRATION_API_KEY" || { echo "::error::DSH_INTEGRATION_API_KEY is required"; exit 1; }
          test -n "$LANGFUSE_BASE_URL" || { echo "::error::LANGFUSE_BASE_URL is required"; exit 1; }
          test -n "$LANGFUSE_PUBLIC_KEY" || { echo "::error::LANGFUSE_PUBLIC_KEY is required"; exit 1; }
          test -n "$LANGFUSE_SECRET_KEY" || { echo "::error::LANGFUSE_SECRET_KEY is required"; exit 1; }
          # Pasted secrets often carry a trailing newline, which corrupts Basic auth.
          printf 'LANGFUSE_BASE_URL=%s\n' "$(printf '%s' "$LANGFUSE_BASE_URL" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$(printf '%s' "$LANGFUSE_PUBLIC_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          printf 'LANGFUSE_SECRET_KEY=%s\n' "$(printf '%s' "$LANGFUSE_SECRET_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          if [ "${{ matrix.extension }}" = pi-web-access ]; then
            test -n "$FIRECRAWL_API_KEY" || { echo "::error::FIRECRAWL_API_KEY is required"; exit 1; }
          fi

      - name: Install dsh-pi, dsh-langfuse, and ${{ matrix.extension }}
        # dsh-langfuse's Langfuse/OTEL peers are optional lazy imports and must be
        # installed explicitly; dsh plugin add does not auto-install peer trees.
        run: dsh plugin --profile headless add "$DSH_PI_TARBALL" "${{ matrix.package }}" @amaster.ai/dsh-langfuse@0.1.2 @langfuse/tracing @langfuse/otel @opentelemetry/sdk-trace-node @opentelemetry/api @opentelemetry/exporter-trace-otlp-http

      - name: Configure and verify the profile
        run: |
          cp ".github/dsh-smoke/${{ matrix.extension }}/cordis.patch.yml" "$PI_CODING_AGENT_DIR/cordis.patch.yml"
          cp ".github/dsh-smoke/${{ matrix.extension }}/settings.json" "$PI_CODING_AGENT_DIR/settings.json"
          cp .github/dsh-smoke/probe.mjs "$PI_CODING_AGENT_DIR/dsh-smoke-probe.mjs"
          test -f "$PI_CODING_AGENT_DIR/node_modules/${{ matrix.specifier }}/package.json"
          dsh --profile headless --patch .github/dsh-smoke/model.patch.yml --dump-config > "$RUNNER_TEMP/dsh-config.yml"
          grep -F "${{ matrix.specifier }}" "$RUNNER_TEMP/dsh-config.yml"
          grep -F 'provider: deepseek-official' "$RUNNER_TEMP/dsh-config.yml"
          grep -F 'model: deepseek-v4-flash' "$RUNNER_TEMP/dsh-config.yml"
          export DSH_SMOKE_EXPECTED_TOOL="${{ matrix.tool }}"
          export DSH_SMOKE_EXPECTED_RESULT="${{ matrix.expected-result }}"
          export DSH_SMOKE_WITNESS="$RUNNER_TEMP/${{ matrix.extension }}.loaded"
          set -o pipefail
          dsh --profile headless --patch .github/dsh-smoke/model.patch.yml "${{ matrix.prompt }}" 2>&1 \
            | tee "$RUNNER_TEMP/${{ matrix.extension }}-dsh.log"
          test "$(cat "$DSH_SMOKE_WITNESS")" = "$DSH_SMOKE_EXPECTED_TOOL"

      - name: Verify Langfuse traces
        # Prints status codes only; keys stay in the Authorization header.
        run: node .github/dsh-smoke/verify-langfuse.mjs
